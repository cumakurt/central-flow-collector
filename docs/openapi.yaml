        "401": {description: Authentication required}
        "403": {description: Permission denied}
  /api/v1/analytics/service-series:
    get:
      summary: Multi-series service, port, protocol or application timeline
      description: Requires analytics.read permission. Aggregates up to eight selected series in one storage analysis. Standard flow predicates, from and to can further scope the population.
      parameters:
        - {name: series_service, in: query, description: Repeatable standard service ID., schema: {type: string}}
        - {name: series_port, in: query, description: Repeatable either-endpoint port selector such as tcp:8443, udp:53, sctp:2905 or any:1234., schema: {type: string}}
        - {name: series_protocol, in: query, description: Repeatable IP protocol name or number., schema: {type: string}}
        - {name: series_app, in: query, description: Repeatable exporter-provided application value., schema: {type: string}}
        - {name: from, in: query, schema: {type: string, format: date-time}}
        - {name: to, in: query, schema: {type: string, format: date-time}}
      responses:
        "200": {description: Per-series totals and aligned timeline points}
        "400": {description: Invalid selector or flow filter}
        "401": {description: Authentication required}
        "403": {description: Permission denied}
        "408": {description: Cancelled or timed out}
  /api/v1/analytics/baseline:
    get:
      summary: GET analytics baseline
