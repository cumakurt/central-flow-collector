  /api/v1/analytics/query:
    get:
      summary: Bounded advanced analysis over complete flow populations
      description: Uses analytics.read permission. Downloads also require flows.export. Raw periods are limited to 31 days, grouped results to 20000, time buckets to 2000 and concurrent requests to two. Standard flow predicates apply. Time windows are UTC and half-open. Counters are observed, never silently extrapolated for sampling.
      parameters:
        - {name: kind, in: query, schema: {type: string, enum: [changes, concentration, distribution, relationships, diversity, temporal, quality, persistence, anomalies], default: changes}}
        - {name: event_state, in: query, description: Optional retrospective anomaly episode filter applied before the result limit., schema: {type: string, enum: [PENDING, ACTIVE, RECOVERED]}}
        - {name: dimension, in: query, schema: {type: string, default: application}}
        - {name: peer, in: query, schema: {type: string, default: dst_ip}}
        - {name: metric, in: query, schema: {type: string, enum: [bytes, packets, flows], default: bytes}}
        - {name: bucket, in: query, schema: {type: integer, enum: [60, 300, 900, 3600, 86400], default: 3600}}
        - {name: top, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 25}}
        - {name: bins, in: query, schema: {type: integer, minimum: 4, maximum: 64, default: 24}}
        - {name: strategy, in: query, schema: {type: string, enum: [linear, logarithmic], default: logarithmic}}
        - {name: threshold, in: query, schema: {type: number, minimum: 50, maximum: 99.9, default: 99}}
        - {name: capacity_bps, in: query, schema: {type: number, minimum: 0, maximum: 1000000000000000, default: 0}}
        - {name: format, in: query, schema: {type: string, enum: [csv, json]}}
        - {name: from, in: query, schema: {type: string, format: date-time}}
        - {name: to, in: query, schema: {type: string, format: date-time}}
      responses:
        "200": {description: Statistics, bounded rows, method, sampling coverage and query metadata; or CSV/JSON attachment}
        "400": {description: Invalid analytical specification or filter}
        "401": {description: Authentication required}
        "403": {description: Read or export permission denied}
        "408": {description: Cancelled or timed out}
        "422": {description: Range, bucket or cardinality guard exceeded, or storage unavailable}
        "429": {description: Advanced query concurrency limit reached}
