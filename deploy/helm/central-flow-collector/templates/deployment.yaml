apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels: {app: {{ .Release.Name }}}
  template:
    metadata:
      labels: {app: {{ .Release.Name }}}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 65532, fsGroup: 65532}
      containers:
        - name: flowcollector
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["run","--config","/etc/flowcollector/config.yaml"]
          ports:
            - {name: web, containerPort: 8080, protocol: TCP}
            - {name: netflow, containerPort: 2055, protocol: UDP}
            - {name: ipfix, containerPort: 4739, protocol: UDP}
            - {name: sflow, containerPort: 6343, protocol: UDP}
          readinessProbe: {httpGet: {path: /ready, port: web}, initialDelaySeconds: 3, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /health, port: web}, initialDelaySeconds: 5, periodSeconds: 10}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: ["ALL"]}}
          volumeMounts:
            - {name: config, mountPath: /etc/flowcollector, readOnly: true}
            - {name: data, mountPath: /var/lib/flowcollector}
            - {name: tmp, mountPath: /tmp}
          resources: {{ toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: config
          configMap: {name: {{ .Release.Name }}-config}
        - name: tmp
          emptyDir: {}
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim: {claimName: {{ .Release.Name }}-data}
          {{- else }}
          emptyDir: {}
          {{- end }}
